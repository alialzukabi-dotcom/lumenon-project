<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحة العنوان | بين الموجة والجسيم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .simple-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 4rem 2rem;
    text-align: center;
    max-width: 700px;
    margin: 0 auto;
  }
  .simple-page h1 {
    font-family: 'Amiri', 'Cairo', serif;
    font-size: clamp(2rem, 6vw, 3.2rem);
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 2rem;
    line-height: 1.4;
  }
  .simple-page h2 {
    font-family: 'Cairo', sans-serif;
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    font-weight: 600;
    color: var(--gold-light);
    margin-bottom: 2rem;
    line-height: 1.8;
    max-width: 600px;
  }
  .simple-page p {
    font-size: 1.05rem;
    color: var(--text-muted);
    font-style: italic;
    margin-bottom: 2rem;
  }
  .simple-page hr {
    border: none;
    width: 150px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 2rem auto;
  }
  .simple-page .author-label {
    font-size: 0.9rem;
    color: var(--text-muted);
    letter-spacing: 3px;
    margin-bottom: 0.8rem;
  }
  .simple-page .author-name {
    font-family: 'Amiri', 'Cairo', serif;
    font-size: clamp(1.3rem, 3vw, 1.7rem);
    font-weight: 700;
    color: var(--gold);
  }
</style>
</head>
<body class="ar">

<div class="simple-page">

  <h1>بين الموجة والجسيم</h1>

  <h2>
    البروتوكول والإتيكيت والمرأة والقدر والاختيار
  </h2>

  <p>قراءة فلسفية في ازدواجية الإنسان</p>

  <hr>

  <p class="author-label">تأليف</p>

  <h2 class="author-name">علي مسلم الزغيبي</h2>

</div>

</body>
</html>
