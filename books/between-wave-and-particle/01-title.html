<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحة العنوان | بين الموجة والجسيم</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23c9a227'/><text x='50' y='68' font-size='60' font-family='Georgia' font-weight='900' text-anchor='middle' fill='%230f0f14'>ب</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .title-page {
    max-width: 700px;
    margin: 0 auto;
    padding: 5rem 2rem;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
  }
  .title-page h1 {
    font-family: 'Amiri', 'Cairo', serif;
    font-size: clamp(2rem, 6vw, 3.2rem);
    color: var(--gold);
    margin-bottom: 1.5rem;
    line-height: 1.3;
    font-weight: 700;
  }
  .title-page h2 {
    font-family: 'Cairo', sans-serif;
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    color: var(--gold-light);
    margin-bottom: 2rem;
    line-height: 1.8;
    font-weight: 600;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
  }
  .title-page p {
    font-size: 1.05rem;
    color: var(--text-muted);
    margin-bottom: 1.5rem;
    line-height: 2;
  }
  .title-page .genre {
    font-style: italic;
    color: var(--gold-light);
    font-size: 1.1rem;
  }
  .title-page .divider {
    width: 150px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 2rem auto;
  }
  .title-page .author-label {
    font-size: 0.9rem;
    letter-spacing: 3px;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
  }
  .title-page .author-name {
    font-family: 'Amiri', 'Cairo', serif;
    font-size: clamp(1.4rem, 3vw, 1.8rem);
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 2rem;
  }
  .title-page .tagline {
    margin-top: 3rem;
    font-size: 1rem;
    color: var(--text-muted);
    line-height: 2;
    max-width: 550px;
    margin-left: auto;
    margin-right: auto;
    font-style: italic;
  }
</style>
</head>
<body class="ar">

<div class="progress-bar" id="progressBar"></div>

<button class="lang-btn" onclick="toggleLang()" aria-label="Switch language">
  <span class="en-only">العربية</span>
  <span class="ar-only">English</span>
</button>

<div class="title-page">

  <h1>بين الموجة والجسيم</h1>

  <h2>البروتوكول والإتيكيت والمرأة والقدر والاختيار</h2>

  <p class="genre">رواية فلسفية</p>

  <div class="divider"></div>

  <p class="author-label">تأليف</p>

  <p class="author-name">علي مسلم الزغيبي</p>

  <div class="divider"></div>

  <p class="tagline">
    رواية عن الإنسان حين يجد نفسه بين ما لم يختره،<br>
    وما يزال قادرًا على اختياره.
  </p>

</div>

<script>
  function toggleLang() {
    document.body.classList.toggle('ar');
    const isAr = document.body.classList.contains('ar');
    document.documentElement.lang = isAr ? 'ar' : 'en';
    document.documentElement.dir = isAr ? 'rtl' : 'ltr';
    localStorage.setItem('lumenon-book-lang', isAr ? 'ar' : 'en');
  }
  (function() {
    const saved = localStorage.getItem('lumenon-book-lang');
    if (saved === 'en') {
      document.body.classList.remove('ar');
      document.documentElement.lang = 'en';
      document.documentElement.dir = 'ltr';
    }
  })();
  const progressBar = document.getElementById('progressBar');
  window.addEventListener('scroll', () => {
    const scrollTop = window.scrollY;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const progress = (docHeight > 0) ? (scrollTop / docHeight) * 100 : 0;
    progressBar.style.width = progress + '%';
  });
</script>

</body>
</html>
